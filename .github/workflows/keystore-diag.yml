name: Keystore diag

# Temporary: figure out whether AGP replaces the debug keystore at
# $ANDROID_USER_HOME/debug.keystore during configuration/signing.
# Run manually; deletes itself once the question is answered.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - uses: gradle/actions/setup-gradle@v6

      - name: What the runner image already ships
        run: |
          echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          echo "ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-<unset>}"
          echo "HOME=$HOME"
          find / -name 'debug.keystore' -not -path '*/proc/*' 2>/dev/null | head -20
          echo "--- pre-seeded keystores above (empty means none) ---"

      - name: Restore our keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/debug.keystore
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"
          cp /tmp/debug.keystore "$HOME/.android/debug.keystore"

      - name: Fingerprint before any Gradle run
        run: |
          set -euo pipefail
          sha256sum /tmp/debug.keystore "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android 2>&1 | grep -E "Alias name|SHA256:|Entry type"

      - name: Run signingReport only
        run: ./gradlew :app:signingReport --console=plain | grep -iE "Variant:|Store:|Alias:" || true

      - name: Fingerprint after signingReport
        run: |
          set -euo pipefail
          echo "--- did AGP rewrite the file? ---"
          sha256sum "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android 2>&1 | grep -E "Alias name|SHA256:|Entry type"
          echo "--- any other debug.keystore now? ---"
          find / -name 'debug.keystore' -not -path '*/proc/*' 2>/dev/null | head -20