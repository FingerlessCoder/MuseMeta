name: Release

# Build + publish the signed release APK whenever a version tag is pushed.
#
# This workflow exists because releases used to be produced by hand: run
# assembleRelease locally, then gh release create whatever APK happened to be
# on disk. Nothing tied the artifact to the tag, so an APK built before some
# commits landed could be published under a tag pointing at newer code. The
# published v1.0.119 was exactly that: the tag pointed at ddbc4bc (commit 120)
# while the attached APK was versionCode 119.
#
# Two guards below make that class of mistake impossible to publish:
#   * the artifact's versionCode must equal the commit count and the tag
#   * the artifact's signing certificate must equal the expected fingerprint
#
# The second guard matters because the published APK must be signed by the same
# key as every existing install. A different key means the user cannot upgrade —
# they would have to uninstall first, losing the Room scan database and the
# DataStore settings.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history is required. app/build.gradle.kts derives versionCode
          # from `git rev-list --count HEAD`, which returns 1 in the shallow
          # clone checkout performs by default — and GitCommitCountSource
          # swallows the nonsense result and falls back to 1.
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Hand the keystore to the build explicitly.
      #
      # This used to write debug.keystore into several plausible locations and let
      # app/build.gradle.kts pick it up through signingConfigs["debug"]. That does
      # not work: the file was restored correctly (sha256 and certificate
      # verified on the runner), signingReport reported that exact store path for
      # the release variant, AGP left the file untouched, and the APK still came
      # out signed by a different key. AGP's implicit debug keystore resolution is
      # therefore not trustworthy for a published artifact.
      #
      # app/build.gradle.kts now defines a "releaseFromEnv" signing config that
      # takes RELEASE_STORE_FILE and friends, so the keystore in, the key out.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/muse-meta.jks"
          test -s "$RUNNER_TEMP/keystore/muse-meta.jks"
          sha256sum "$RUNNER_TEMP/keystore/muse-meta.jks"
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/keystore/muse-meta.jks"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Report resolved signing config
        run: |
          ./gradlew :app:signingReport --console=plain | grep -A4 -i "Variant: release"

      - name: Verify APK signing certificate
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs "$apk" | grep -oE '[0-9a-f]{64}' | head -1)
          echo "expected cert: ${EXPECTED_CERT_SHA256:-<unset>}"
          echo "actual   cert: $actual"
          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "::warning::RELEASE_CERT_SHA256 is not set; skipping certificate check"
            exit 0
          fi
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signed by $actual, expected $EXPECTED_CERT_SHA256 — this build cannot be installed over existing installs, refusing to publish"
            exit 1
          fi
          echo "signing certificate matches"

      # Guards against publishing an APK that was built before some commits landed.
      - name: Verify APK versionCode matches commit count and tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          meta=app/build/outputs/apk/release/output-metadata.json
          commits=$(git rev-list --count HEAD)
          vc=$(jq -r '.elements[0].versionCode' "$meta")
          vn=$(jq -r '.elements[0].versionName' "$meta")
          echo "tag=$TAG commits=$commits versionCode=$vc versionName=$vn"
          if [ "$vc" != "$commits" ]; then
            echo "::error::APK versionCode ($vc) != commit count ($commits) — refusing to publish a stale build"
            exit 1
          fi
          if [ "$TAG" != "v$vn" ]; then
            echo "::error::tag $TAG does not match built versionName v$vn"
            exit 1
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            --verify-tag \
            --title "$TAG" \
            --generate-notes