# JDK 26 Configuration for MuseMeta project
org.gradle.java.home=/usr/lib/jvm/java-26-openjdk-amd64  # Update to your actual JDK path
org.gradle.jvmargs=-Djava.version=21 --add-opens java.base/java.lang=ALL-UNNAMED

# Android specific settings for Media3 compatibility
android.useAndroidX=true
android.enableJetifier=true

# Enable multidex support explicitly
multiDexEnabled=true
multiDexKeepProguard=false  # Remove this if present in proguard-rules.pro